name: Cascanueces 12/26 watch

on:
  schedule:
    - cron: "17 * * * *"   # 백업용: 매시간 17분 (GitHub이 건너뛰는 경우가 있어서 아래 '다음 실행 예약'이 주력)
  workflow_dispatch:         # 수동 실행 버튼
    inputs:
      test_alert:
        description: "GitHub 알림 시험용: 일부러 실패시킴"
        type: boolean
        default: false

permissions:
  contents: read             # 저장소 체크아웃용
  actions: write             # 다음 실행 예약

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Restore last seen state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watch-state-
      - name: Check 12/26 and 12/27
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
        run: |
          set +e
          if [ "$TEST_ALERT" = "true" ]; then ARGS="--once"; else ARGS="--max-minutes 55 --interval 180"; fi
          python watch.py $ARGS
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0=정상 종료 / 10=풀림(알림 발송됨) / 2=대상 날짜 카드 없음 / 3=접속 실패
          if [ "$code" = "0" ] || [ "$code" = "10" ]; then exit 0; fi
          exit "$code"
      - name: Save state
        if: always() && github.event.inputs.test_alert != 'true' && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Schedule next run
        if: (steps.check.outputs.code == '0' || steps.check.outputs.code == '10') && github.event.inputs.test_alert != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: "TICKETS AVAILABLE (intentional fail so GitHub sends a notification)"
        if: steps.check.outputs.code == '10'
        run: exit 1
      - name: "TEST ALERT (intentional fail, manual test only)"
        if: github.event.inputs.test_alert == 'true'
        run: exit 1
