name: Cascanueces 12/26 watch

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 최소 간격, 실제로는 몇 분 지연될 수 있음)
  workflow_dispatch:         # 수동 실행 버튼
    inputs:
      test_alert:
        description: "GitHub 알림 시험용: 일부러 실패시킴"
        type: boolean
        default: false

permissions:
  contents: read             # 저장소 체크아웃용
  actions: write             # 알림 후 스스로 비활성화하기 위해

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check 12/26
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          python watch.py --once
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0=품절 / 10=풀림(알림 발송됨) / 2=12/26 카드 없음 / 3=접속 실패
          if [ "$code" = "0" ] || [ "$code" = "10" ]; then exit 0; fi
          exit "$code"
      - name: Stop watching after alert
        if: steps.check.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Cascanueces 12/26 watch" --repo "$GITHUB_REPOSITORY"
      - name: "TICKETS AVAILABLE (intentional fail so GitHub sends a notification)"
        if: steps.check.outputs.code == '10'
        run: exit 1
      - name: "TEST ALERT (intentional fail, manual test only)"
        if: github.event.inputs.test_alert == 'true'
        run: exit 1
